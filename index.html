<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f6b57">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التقييم">

<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>تقييم الموظفين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
/* Layout: sticky top bar with month picker and lock status, four tabs (evaluate by week / dashboard / employee detail / setup by job title), single centered column up to 880px */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#17211d; --muted:#5d6b65; --line:#dbe2de;
  --accent:#0f6b57; --accent-fg:#ffffff; --accent-soft:#e1f1ec;
  --good:#12805c; --good-soft:#dff3ea; --ok:#2f6fb3; --ok-soft:#e1ecf8;
  --mid:#a86a00; --mid-soft:#faefd6; --bad:#b4372b; --bad-soft:#f9e1de;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#18221e; --fg:#e8efec; --muted:#9baba4; --line:#2b3a34;
  --accent:#4cc3a3; --accent-fg:#06211a; --accent-soft:#17352d;
  --good:#52d19f; --good-soft:#143a2c; --ok:#79b3ee; --ok-soft:#162b42;
  --mid:#e5b04a; --mid-soft:#3b2f12; --bad:#f08a7e; --bad-soft:#40201c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#18221e; --fg:#e8efec; --muted:#9baba4; --line:#2b3a34;
  --accent:#4cc3a3; --accent-fg:#06211a; --accent-soft:#17352d;
  --good:#52d19f; --good-soft:#143a2c; --ok:#79b3ee; --ok-soft:#162b42;
  --mid:#e5b04a; --mid-soft:#3b2f12; --bad:#f08a7e; --bad-soft:#40201c; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.bar .l{display:flex;align-items:center;gap:10px}
h1{font-size:1.15rem;margin:0;font-weight:700}
.month{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.85rem}
input,select,button{font:inherit;color:inherit}
input[type=month],input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav button[aria-selected=true]{color:var(--accent);border-color:var(--accent);font-weight:700}
main{padding-top:20px;display:flex;flex-direction:column;gap:20px}
.note{background:var(--mid-soft);color:var(--fg);border-radius:6px;padding:10px 14px;font-size:.85rem}
.note.info{background:var(--accent-soft)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.panel h2{font-size:1rem;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.grow{flex:1;min-width:0}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.big{font-size:2.2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.b-top{background:var(--good-soft);color:var(--good)}.b-vg{background:var(--ok-soft);color:var(--ok)}
.b-g{background:var(--mid-soft);color:var(--mid)}.b-bad{background:var(--bad-soft);color:var(--bad)}.b-none{background:var(--bg);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 14px;cursor:pointer;font-weight:500}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.crit{padding:12px 0;border-top:1px solid var(--line)}
.crit:first-of-type{border-top:0}
.crit .name{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.crit .w{color:var(--muted);font-size:.78rem;font-weight:400}
.scores{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.scores button{width:2.2rem;height:2.2rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-variant-numeric:tabular-nums}
.scores button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.scores button:disabled{cursor:default;opacity:.7}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th{color:var(--muted);font-weight:500;font-size:.78rem}
.meter{display:inline-block;width:90px;height:8px;background:var(--bg);border-radius:4px;vertical-align:middle;overflow:hidden;margin-inline-start:8px}
.meter i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border-radius:8px;padding:10px 14px}.tile b{font-size:1.5rem;display:block;font-variant-numeric:tabular-nums}
.btn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.x{background:none;border:0;color:var(--bad);cursor:pointer;padding:4px 8px;font-size:1.1rem}
.set-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.set-row input[type=text]{flex:1;min-width:0}.set-row input[type=number]{width:4.5rem}.set-row select{max-width:11rem}
.empty{color:var(--muted);text-align:center;padding:24px 0}
input[type=email],input[type=password]{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.days{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.days button{flex:none;min-width:2.4rem;height:2.4rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.days button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.days button.has::after{content:"";position:absolute;bottom:3px;left:50%;margin-left:-2.5px;width:5px;height:5px;border-radius:50%;background:var(--good)}
.days button[aria-pressed=true].has::after{background:var(--accent-fg)}
.days button.today{border-color:var(--accent);border-width:2px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;color:inherit;resize:vertical}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sub{color:var(--muted);font-size:.8rem;font-weight:400}
.tile.n{background:var(--surface);border:1px solid var(--line)}
.tile.n small{display:block;color:var(--muted);font-size:.78rem}
.pos{color:var(--good)}.neg{color:var(--bad)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.two h3{font-size:.9rem;margin:0 0 8px}.two ul{margin:0;padding-inline-start:18px}.two li{margin-bottom:4px}
.chart{direction:ltr;max-width:460px}.chart svg{width:100%;height:auto;display:block}
.cb{fill:var(--accent)}.ct{fill:var(--fg)}.cm{fill:var(--muted)}.cl{stroke:var(--muted);stroke-dasharray:4 4;opacity:.6}
.sec-r{background:var(--bg);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}.prog .nm{width:9rem;flex:none}.prog .meter{flex:1;width:auto;margin:0}.prog .vl{width:4.5rem;text-align:left;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>


</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
<div id="gate" style="padding-top:28px"></div>
<header hidden>
  <div class="bar">
    <div class="l"><h1>تقييم الموظفين</h1><span id="lockpill"></span><span id="syncpill" class="sub"></span></div>
    <div class="row"><label class="month">الشهر <input type="month" id="month"></label><button class="btn ghost" id="logout">خروج</button></div>
  </div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="eval" aria-selected="true">التقييم الأسبوعي</button>
    <button role="tab" data-tab="dash" aria-selected="false">لوحة النتائج</button>
    <button role="tab" data-tab="detail" aria-selected="false">تفاصيل الموظف</button>
    <button role="tab" data-tab="setup" aria-selected="false">الموظفون والمسميات</button>
  </nav>
</header>
<main id="main" hidden></main>
</div>

<script>
(function(){
var KEY='staffEval.v2';
var unlocked=false;
function uid(){return Math.random().toString(36).slice(2,8)}
function mkSecs(prefix,def){return def.map(function(d,si){var sid=prefix+'s'+si;return {id:sid,name:d[0],criteria:d[1].map(function(c,i){return {id:sid+'c'+i,name:c[0],w:c[1]}})}})}
function sample(){
  var t1=mkSecs('a',[['الأداء الوظيفي',[['الالتزام بالمواعيد',3],['دقة الكاشير والجرد',4],['سرعة الخدمة',3],['الالتزام بإجراءات السلامة والنظافة',3]]],['الصفات الشخصية',[['المظهر العام',2],['الانضباط',3],['تحمل الضغط',2]]],['العلاقات',[['التعامل مع العملاء',4],['التعاون مع الزملاء',3]]]]);
  var t2=mkSecs('b',[['الأداء الوظيفي',[['إدارة الوردية',4],['التقارير والجرد',4],['متابعة النظافة والسلامة',3],['الالتزام بالمواعيد',2]]],['الصفات الشخصية',[['القيادة',4],['اتخاذ القرار',3],['المبادرة',2]]],['العلاقات',[['التعامل مع العملاء',3],['التعامل مع الفريق',4]]]]);
  return {tab:'eval',month:new Date().toISOString().slice(0,7),week:1,dview:'m',sel:'e1',stitle:'t1',
    titles:[{id:'t1',name:'كاشير',sections:t1},{id:'t2',name:'مشرف وردية',sections:t2}],
    employees:[{id:'e1',name:'موظف تجريبي 1',title:'t1'},{id:'e2',name:'موظف تجريبي 2',title:'t1'},{id:'e3',name:'موظف تجريبي 3',title:'t1'},{id:'e4',name:'موظف تجريبي 4',title:'t2'},{id:'e5',name:'موظف تجريبي 5',title:'t2'}],
    scores:{},closed:{},example:true};
}
function load(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function single(snap){ // convert old single-criteria-set data to one job title
  if(snap.sections&&!snap.titles){snap.titles=[{id:'t1',name:'موظف',sections:snap.sections}];snap.employees.forEach(function(e){e.title='t1'});delete snap.sections}
}
var S=load(KEY);
if(S&&S.sections&&!S.titles){single(S);Object.keys(S.closed||{}).forEach(function(m){single(S.closed[m])})}
if(!S||!S.titles){
  var old=load('staffEval.v1');S=sample();
  if(old&&old.sections){S.employees=old.employees;S.titles=null;S.sections=old.sections;single(S);S.example=old.example;S.month=old.month||S.month;S.sel=old.sel;S.stitle='t1';
    Object.keys(old.scores||{}).forEach(function(m){S.scores[m]={1:old.scores[m]}})}
}
S.closed=S.closed||{};S.week=S.week||1;S.dview=S.dview||'m';S.notes=S.notes||{};
var PK='staffEval.cloud.prefs';
(function(){var p=load(PK);if(p)['tab','week','dview','sel','stitle','month','mode','day'].forEach(function(k){if(p[k]!=null)S[k]=p[k]})})();
var fdb=null,fauth=null,cfgRef=null,unsubMonth=null,unsubCfg=null,configReady=false,monthReady={},dirtyCfg=false,dirtyMonths={},timer=null;
function strip(o){return JSON.parse(JSON.stringify(o))}
function monthRef(m){return fdb.collection('months').doc(m)}
function cfgDoc(){return strip({employees:S.employees,titles:S.titles,pin:S.pin||null,example:!!S.example})}
function monthDoc(m){
  var notes={};Object.keys(S.notes).forEach(function(k){if(k.indexOf(m+'|')===0&&String(S.notes[k]).trim())notes[k.slice(m.length+1)]=S.notes[k]});
  return strip({scores:S.scores[m]||{},closed:S.closed[m]||null,notes:notes});
}
function status(k,extra){
  var el=document.getElementById('syncpill');if(!el)return;
  el.textContent=k==='saving'?'جاري الحفظ…':k==='saved'?'تم الحفظ':k==='loading'?'جاري التحميل…':k==='error'?'تعذر الحفظ ('+(extra||'خطأ')+')':'';
  el.style.color=k==='error'?'var(--bad)':'';
}
function save(){
  try{localStorage.setItem(PK,JSON.stringify({tab:S.tab,week:S.week,dview:S.dview,sel:S.sel,stitle:S.stitle,month:S.month,mode:S.mode,day:S.day}))}catch(e){}
  if(!fdb)return;
  if(configReady)dirtyCfg=true;
  if(monthReady[S.month])dirtyMonths[S.month]=true;
  if(dirtyCfg||Object.keys(dirtyMonths).length){status('saving');clearTimeout(timer);timer=setTimeout(flush,700)}
}
async function flush(){
  timer=null;
  try{
    if(dirtyCfg){dirtyCfg=false;try{await cfgRef.set(cfgDoc())}catch(e){dirtyCfg=true;throw e}}
    var ms=Object.keys(dirtyMonths);
    for(var i=0;i<ms.length;i++){var m=ms[i];delete dirtyMonths[m];try{await monthRef(m).set(monthDoc(m))}catch(e){dirtyMonths[m]=true;throw e}}
    status('saved');
  }catch(err){status('error',err&&err.code);clearTimeout(timer);timer=setTimeout(flush,8000)}
}
document.addEventListener('visibilitychange',function(){if(document.hidden&&timer){clearTimeout(timer);flush()}});
function softRender(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.id!=='month')return;render()}
function attachMonth(){
  if(!fdb)return;
  if(unsubMonth)unsubMonth();
  var m=S.month;status('loading');
  unsubMonth=monthRef(m).onSnapshot(function(snap){
    if(m!==S.month||snap.metadata.hasPendingWrites)return;
    if(dirtyMonths[m])return;
    var d=snap.exists?snap.data():{};
    S.scores[m]=d.scores||{};
    if(d.closed)S.closed[m]=d.closed;else delete S.closed[m];
    Object.keys(S.notes).forEach(function(k){if(k.indexOf(m+'|')===0)delete S.notes[k]});
    Object.keys(d.notes||{}).forEach(function(e){S.notes[m+'|'+e]=d.notes[e]});
    monthReady[m]=true;status('saved');softRender();
  },function(err){status('error',err&&err.code)});
}
function applyCfg(d){S.employees=d.employees||[];S.titles=d.titles||[];S.pin=d.pin||null;S.example=!!d.example;if(!S.titles.some(function(t){return t.id===S.stitle}))S.stitle=S.titles[0]?S.titles[0].id:''}
function showGate(html){document.querySelector('header').hidden=true;document.getElementById('main').hidden=true;var g=document.getElementById('gate');g.hidden=false;g.innerHTML=html}
function hideGate(){document.getElementById('gate').hidden=true;document.querySelector('header').hidden=false;document.getElementById('main').hidden=false}
function authMsg(c){return {'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة.','auth/wrong-password':'كلمة المرور غير صحيحة.','auth/user-not-found':'هذا البريد غير مسجل.','auth/invalid-email':'البريد غير صحيح.','auth/too-many-requests':'محاولات كثيرة. انتظر قليلا وجرب مرة ثانية.','auth/network-request-failed':'لا يوجد اتصال بالإنترنت.'}[c]||'تعذر تسجيل الدخول ('+c+').'}
function loginForm(msg){
  showGate('<div class="panel" style="max-width:420px;margin:0 auto"><h1 style="margin-bottom:4px">تقييم الموظفين</h1><p class="sub" style="margin-top:0">سجّل الدخول للمتابعة.</p>'+
    '<label>البريد الإلكتروني<br><input type="email" id="lemail" autocomplete="username" dir="ltr" style="width:100%"></label><br><br>'+
    '<label>كلمة المرور<br><input type="password" id="lpass" autocomplete="current-password" dir="ltr" style="width:100%"></label><br><br>'+
    '<button class="btn" id="login" style="width:100%">دخول</button>'+(msg?'<p style="color:var(--bad);margin-bottom:0" role="alert">'+esc(msg)+'</p>':'')+'</div>');
  var em=document.getElementById('lemail'),pw=document.getElementById('lpass');
  async function go(){
    var btn=document.getElementById('login');btn.disabled=true;
    try{await fauth.signInWithEmailAndPassword(em.value.trim(),pw.value)}catch(e){loginForm(authMsg(e&&e.code))}
  }
  document.getElementById('login').addEventListener('click',go);
  pw.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
}
function gateError(title,text){showGate('<div class="panel" style="max-width:520px;margin:0 auto"><h2>'+title+'</h2><p>'+text+'</p><button class="btn ghost" id="gout">تسجيل الخروج</button> <button class="btn" id="gretry">إعادة المحاولة</button></div>');
  document.getElementById('gout').addEventListener('click',function(){fauth.signOut().then(function(){location.reload()})});
  document.getElementById('gretry').addEventListener('click',function(){location.reload()})}
async function boot(){
  showGate('<div class="empty">جاري التحميل…</div>');
  try{
    cfgRef=fdb.collection('app').doc('config');
    var snap=await cfgRef.get();
    if(!snap.exists){ // first run: move whatever is in this browser up to the database
      await cfgRef.set(cfgDoc());
      var ms={};Object.keys(S.scores).concat(Object.keys(S.closed)).forEach(function(m){ms[m]=1});
      Object.keys(S.notes).forEach(function(k){ms[k.split('|')[0]]=1});
      for(var m in ms)await monthRef(m).set(monthDoc(m));
    }else{
      applyCfg(snap.data());S.scores={};S.closed={};S.notes={};
    }
    configReady=true;
    unsubCfg=cfgRef.onSnapshot(function(sn){
      if(sn.metadata.hasPendingWrites||dirtyCfg||!sn.exists)return;
      applyCfg(sn.data());softRender();
    });
    S.confirmReset=false;S.msg='';
    hideGate();attachMonth();render();
  }catch(err){
    if(err&&err.code==='permission-denied')gateError('هذا الحساب غير مصرح له','تأكد أن بريدك هو نفسه المكتوب في قواعد Firestore.');
    else gateError('تعذر الاتصال بقاعدة البيانات','تأكد من الإنترنت ومن ملف firebase-config.js ثم أعد المحاولة. ('+((err&&err.code)||'خطأ')+')');
  }
}
function startApp(){
  var c=window.FIREBASE_CONFIG;
  var why=!c?'ملف firebase-config.js غير موجود أو لم يُرفع بجانب index.html بنفس الاسم تماما.':
    (!c.apiKey||/^PASTE/i.test(c.apiKey)||/PASTE/.test(c.projectId||'')||/PASTE/.test(c.appId||''))?'ملف firebase-config.js ما زال فيه كلمة PASTE. استبدل كل القيم بقيم مشروعك من Firebase.':
    typeof firebase==='undefined'?'تعذر تحميل مكتبة Firebase. تأكد من الإنترنت وأن الصفحة مفتوحة من Chrome أو Safari مباشرة.':'';

function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cfg(){return S.closed[S.month]||{employees:S.employees,titles:S.titles}}

function peersOf(cf,id){var e=empOf(cf,id),t=e&&tOf(cf,e);return cf.employees.filter(function(x){var tx=tOf(cf,x);return t&&tx&&tx.id===t.id})}

function dailyAvg(wk,emp,cid){var a=0,n=0,lo=(wk-1)*7+1,hi=wk===4?31:wk*7;for(var d=lo;d<=hi;d++){var v=rawsc('d'+pad2(d),emp,cid);if(v!=null){a+=v;n++}}return n?a/n:null}

function calcW(emp,list,wk){

async function hashPin(pin,salt){
  try{var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pin));
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0')}).join('')}
  catch(e){var h=5381,s=salt+':'+pin;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'x'+h}
}
function pinForm(title,btn){
  return '<div class="panel"><h2>'+title+'</h2><div class="row"><input type="password" id="pin1" inputmode="numeric" autocomplete="new-password" placeholder="الكود (4 على الأقل)" aria-label="الكود"><input type="password" id="pin2" inputmode="numeric" autocomplete="new-password" placeholder="تأكيد الكود" aria-label="تأكيد الكود"><button class="btn" id="setpin">'+btn+'</button></div></div>';
}
async function doSetPin(){
  var a=document.getElementById('pin1').value,b=document.getElementById('pin2').value;
  if(a.length<4){S.msg='الكود لازم يكون 4 أرقام أو حروف على الأقل.';render();return}
  if(a!==b){S.msg='الكودان غير متطابقين.';render();return}
  var salt=uid()+uid();S.pin={salt:salt,hash:await hashPin(a,salt)};
  unlocked=true;S.changing=false;S.msg='تم حفظ الكود.';save();render();
}
async function doUnlock(){
  var v=document.getElementById('pinx').value;
  if(await hashPin(v,S.pin.salt)===S.pin.hash){unlocked=true;S.msg=''}else S.msg='الكود غير صحيح.';
  render();
}

  out+=blk('<div style="color:#5d6b65;font-size:12px;margin-bottom:28px">الدرجات من 10 لكل معيار، والمعايير والأوزان خاصة بالمسمى الوظيفي. التقدير: ممتاز من 90% ، جيد جدا من 80% ، جيد من 77% ، وأقل من ذلك غير مرضي.</div><table style="width:100%;border-collapse:collapse"><tr><td style="width:45%;border-top:1px solid #17211d;padding-top:6px;text-align:center">توقيع الموظف</td><td style="width:10%"></td><td style="width:45%;border-top:1px solid #17211d;padding-top:6px;text-align:center">توقيع المدير</td></tr></table>');
  return out;
}
var MIME={pdf:'application/pdf',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
function getDl(){return Promise.resolve({save:function(o){
  var ext=o.filename.split('.').pop(),blob=new Blob([o.data],{type:MIME[ext]||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=o.filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},4000);
  return Promise.resolve({status:'saved'});}})}
async function doPdf(){
  var host=null;
  try{
    var dl=await getDl();
    if(!dl){S.msg='حفظ الملفات غير متاح في طريقة العرض الحالية. افتح التطبيق من claude.ai.';return}
    if(typeof html2canvas==='undefined'||!window.jspdf){S.msg='تعذر تحميل مكتبة PDF. أعد فتح الصفحة وجرب مرة ثانية.';return}
    S.msg='جاري تجهيز الملف...';render();
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    var emp=empOf(cfg(),S.sel);
    host=document.createElement('div');
    host.style.cssText='position:absolute;left:-10000px;top:0;width:794px;direction:rtl';
    host.innerHTML=buildReport(S.sel);document.body.appendChild(host);
    var pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    var PW=595.28,PH=841.89,M=28,CW=PW-2*M,y=M,blks=host.querySelectorAll('.blk');
    for(var i=0;i<blks.length;i++){
      var cv=await html2canvas(blks[i],{scale:2,backgroundColor:'#ffffff',logging:false});
      var h=cv.height/cv.width*CW;
      if(y+h>PH-M&&y>M){pdf.addPage();y=M}
      pdf.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',M,y,CW,h);
      y+=h;
    }
    var res=await dl.save({filename:'تقييم-'+emp.name.replace(/[\\\/:*?"<>|\s]+/g,'-')+'-'+S.month+'.pdf',data:pdf.output('arraybuffer')});
    S.msg=res.status==='saved'?'تم حفظ ملف PDF.':'تم تجهيز الملف.';
  }catch(err){
    S.msg=err&&err.code==='declined'?'تم إلغاء الحفظ.':'تعذر إنشاء الملف ('+((err&&(err.code||err.message))||'خطأ')+').';
  }finally{if(host&&host.parentNode)host.parentNode.removeChild(host);render()}
}
function sheetName(wb,base){
  var n=base.replace(/[\[\]:*?\/\\]/g,' ').slice(0,31),i=2,b=n;
  while(wb.SheetNames.indexOf(n)>=0){n=b.slice(0,28)+' '+i;i++}
  return n;
}
function buildWB(){
  var cf=cfg(),wb=XLSX.utils.book_new(),st=isClosed()?'مقفل':'مفتوح',names=secNames(cf);
  cf.titles.forEach(function(t){
    var emps=cf.employees.filter(function(e){var te=tOf(cf,e);return te&&te.id===t.id});
    if(!emps.length)return;
    for(var wk=1;wk<=4;wk++){
      var r1=[''],r2=['الموظف'],r3=['الوزن'];
      t.sections.forEach(function(sec){sec.criteria.forEach(function(k,i){r1.push(i===0?sec.name:'');r2.push(k.name);r3.push(k.w)})});
      r1.push('','');r2.push('النسبة %','التقدير');r3.push('','');
      var rows=[r1,r2,r3];
      emps.forEach(function(e){
        var row=[e.name];
        t.sections.forEach(function(sec){sec.criteria.forEach(function(k){var v=sc(wk,e.id,k.id);row.push(v==null?'':rv(v))})});
        var r=calcW(e.id,t.sections,wk);row.push(r.pct==null?'':+r.pct.toFixed(1),band(r.pct)[0]);rows.push(row);
      });
      var ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:22}].concat(r2.slice(1).map(function(n){return {wch:Math.max(10,Math.min(26,String(n).length+2))}}));
      XLSX.utils.book_append_sheet(wb,ws,sheetName(wb,t.name+' أ'+wk));
    }
  });
  var hd=['الموظف','المسمى الوظيفي','أسبوع 1 %','أسبوع 2 %','أسبوع 3 %','أسبوع 4 %','المتوسط الشهري %','التقدير'];
  names.forEach(function(n){hd.push(n+' %')});hd.push('حالة الشهر');
  var mrows=[hd];
  cf.employees.forEach(function(e){
    var secs=secsFor(cf,e.id),row=[e.name,titleName(cf,e)];
    for(var w=1;w<=4;w++){var p=calcW(e.id,secs,w).pct;row.push(p==null?'':+p.toFixed(1))}
    var m=calcM(e.id,secs);row.push(m.pct==null?'':+m.pct.toFixed(1),band(m.pct)[0]);
    names.forEach(function(n){var s=secByName(cf,e.id,n),p=s?calcM(e.id,[s]).pct:null;row.push(p==null?'':+p.toFixed(1))});
    row.push(st);mrows.push(row);
  });
  var wm=XLSX.utils.aoa_to_sheet(mrows);wm['!cols']=hd.map(function(h,i){return {wch:i<2?22:16}});
  XLSX.utils.book_append_sheet(wb,wm,sheetName(wb,'الشهري'));
  var dn2=daysInMonth(),dh=['الموظف','المسمى الوظيفي'];for(var d2=1;d2<=dn2;d2++)dh.push(String(d2));
  var drows=[dh],anyD=false;
  cf.employees.forEach(function(e){var sx=secsFor(cf,e.id),row=[e.name,titleName(cf,e)];for(var d3=1;d3<=dn2;d3++){var pp=calcDay(e.id,sx,d3).pct;if(pp!=null)anyD=true;row.push(pp==null?'':+pp.toFixed(1))}drows.push(row)});
  if(anyD){var wd=XLSX.utils.aoa_to_sheet(drows);wd['!cols']=dh.map(function(h,i){return {wch:i<2?22:7}});XLSX.utils.book_append_sheet(wb,wd,sheetName(wb,'يومي'))}
  wb.Workbook={Views:[{RTL:true}]};
  return wb;
}
async function doExport(){
  try{
    var dl=await getDl();
    if(!dl){S.msg='التصدير غير متاح في طريقة العرض الحالية. افتح التطبيق من claude.ai.';render();return}
    if(typeof XLSX==='undefined'){S.msg='تعذر تحميل مكتبة إكسل. أعد فتح الصفحة وجرب مرة ثانية.';render();return}
    var buf=XLSX.write(buildWB(),{type:'array',bookType:'xlsx'});
    var res=await dl.save({filename:'staff-evaluation-'+S.month+'.xlsx',data:buf});
    S.msg=res.status==='saved'?'تم حفظ ملف إكسل.':'تم تجهيز الملف.';
  }catch(err){
    S.msg=err&&err.code==='declined'?'تم إلغاء الحفظ.':'تعذر حفظ الملف ('+((err&&err.code)||'خطأ')+').';
  }
  render();
}

  var dvb=t.closest('[data-dv]');if(dvb){S.dview=dvb.dataset.dv;save();render();return}
  var op=t.closest('[data-open]');if(op){S.sel=op.dataset.open;S.tab='detail';S.msg='';save();render();window.scrollTo(0,0);return}
  var stb=t.closest('[data-st]');if(stb){S.stitle=stb.dataset.st;save();render();return}
  if(t.id==='export'){doExport();return}
  if(t.id==='pdf'){doPdf();return}
  if(t.id==='close'){
    if(!S.confirmClose){S.confirmClose=true;render();return}
    S.closed[S.month]=JSON.parse(JSON.stringify({employees:S.employees,titles:S.titles}));
    S.confirmClose=false;S.msg='تم إقفال الشهر.';save();render();return}
  if(t.id==='reopen'){delete S.closed[S.month];S.msg='تمت إعادة فتح الشهر.';save();render();return}
  if(t.id==='addEmp'){S.employees.push({id:'e'+uid(),name:'موظف جديد',title:S.stitle||S.titles[0].id});S.example=false;save();render();return}
  if(t.dataset.delemp){S.employees=S.employees.filter(function(x){return x.id!==t.dataset.delemp});save();render();return}
  if(t.id==='addTitle'){var nid='t'+uid(),sid='s'+uid();S.titles.push({id:nid,name:'مسمى جديد',sections:[{id:sid,name:'الأداء الوظيفي',criteria:[{id:sid+'c'+uid(),name:'معيار جديد',w:2}]}]});S.stitle=nid;S.example=false;save();render();return}
  if(t.id==='dupTitle'){var ct=curTitle();if(ct){var cp=JSON.parse(JSON.stringify(ct));cp.id='t'+uid();cp.name=ct.name+' (نسخة)';
    cp.sections.forEach(function(s){s.id='s'+uid();s.criteria.forEach(function(k){k.id=s.id+'c'+uid()})});S.titles.push(cp);S.stitle=cp.id;S.example=false;save();render()}return}
  if(t.dataset.deltitle){if(S.titles.length<2)return;S.titles=S.titles.filter(function(x){return x.id!==t.dataset.deltitle});
    S.employees.forEach(function(x){if(x.title===t.dataset.deltitle)x.title=S.titles[0].id});S.stitle=S.titles[0].id;save();render();return}
  if(t.id==='addSec'){var c2=curTitle();if(c2){var sid2='s'+uid();c2.sections.push({id:sid2,name:'قسم جديد',criteria:[{id:sid2+'c'+uid(),name:'معيار جديد',w:2}]});S.example=false;save();render()}return}
  if(t.dataset.delsec){var c3=curTitle();if(c3){c3.sections=c3.sections.filter(function(s){return s.id!==t.dataset.delsec});save();render()}return}
  if(t.dataset.addc){allSecs(function(s){if(s.id===t.dataset.addc)s.criteria.push({id:s.id+'c'+uid(),name:'معيار جديد',w:2})});S.example=false;save();render();return}
  if(t.dataset.delc){allSecs(function(s){s.criteria=s.criteria.filter(function(k){return k.id!==t.dataset.delc})});save();render();return}
  if(t.id==='setpin'){doSetPin();return}
  if(t.id==='unlock'){doUnlock();return}
  if(t.id==='lockNow'){unlocked=false;S.msg='';render();return}
  if(t.id==='chpin'){S.changing=true;S.msg='';render();return}
  if(t.id==='reset'){
    if(!S.confirmReset){S.confirmReset=true;render();return}
    doReset();return}
});
main.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return;
  var id=e.target.id;
  if(id==='pinx')doUnlock();else if(id==='pin1'||id==='pin2')doSetPin();
});
main.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dnote'){S.notes[S.month+'|'+S.sel]=t.value;save();return}
  if(t.id==='emp'||t.id==='demp'){S.sel=t.value;save();render();return}
  if(t.dataset.emp){S.employees.forEach(function(x){if(x.id===t.dataset.emp)x.name=t.value});S.example=false}
  else if(t.dataset.etitle){S.employees.forEach(function(x){if(x.id===t.dataset.etitle)x.title=t.value});S.example=false;save();render();return}
  else if(t.dataset.tname){S.titles.forEach(function(x){if(x.id===t.dataset.tname)x.name=t.value});S.example=false;save();render();return}
  else if(t.dataset.sec){allSecs(function(s){if(s.id===t.dataset.sec)s.name=t.value})}
  else if(t.dataset.cn){var k=findCrit(t.dataset.cn);if(k)k.name=t.value;S.example=false}
  else if(t.dataset.cw){var k2=findCrit(t.dataset.cw);if(k2)k2.w=Math.max(0,+t.value||0);S.example=false;save();render();return}
  save();
});
startApp();
})();
</script>

<script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
